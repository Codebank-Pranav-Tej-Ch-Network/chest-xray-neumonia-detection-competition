[project]
name = "prml-pa4-gpu"
version = "0.1.0"
description = "PRML 2026 Assignment 4 GPU Pipeline for SPCV Lab and Colab Pro (CS24B057)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "opencv-python-headless>=4.9.0",
    "Pillow>=10.2.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.8.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "timm>=1.0.9",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
